<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saimon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Saimon Says Game</h1>
    <h3>Press any key to start</h3>
    <div class="box_container">
        <div>
            <div class="box red" type="button" id="red">1</div>
            <div class="box blue" type="button" id="blue">3</div>
        </div>
        <div>
            <div class="box yellow" type="button" id="yellow">2</div>
            <div class="box purple" type="button" id="purple">4</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
